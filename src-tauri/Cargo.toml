[package]
name = "gametracker"
version = "0.2.1"
description = "Track the games you own, the ones you want, and what they cost right now"
authors = ["Niklas Heneka"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "gametracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
dotenvy = "0.15.7"
thiserror = "2.0.20"
tauri-plugin-opener = "2.5.4"
tokio = { version = "1.53.1", features = ["time", "sync"] }
reqwest = { version = "0.13.3", features = ["json", "gzip", "query"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-dialog = "2.7.3"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
