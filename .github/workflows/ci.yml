name: CI

on:
  push:
    branches: [main]
    # Without this a tag push does not start the workflow at all, and the
    # bundle job's refs/tags/v condition can never be true.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only unless a job asks for more — only the release job does. Set here
# rather than left to the repository's default, which can be changed.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run irrelevant. Tag runs
# have their own group and a release build is never worth cancelling.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # WebKitGTK and friends are only needed on Linux; macOS and Windows ship
      # their own webviews.

      - run: npm ci

      - name: Typecheck and build the frontend
        run: npm run build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check

      # Live tests are #[ignore]d: they need real API keys and would make CI
      # depend on third-party uptime.
      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib

  bundle:
    name: Bundle (${{ matrix.os }})
    # Only worth the minutes once the fast checks have passed.
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Unsigned: signing needs an Apple Developer certificate and a Windows
      # code-signing certificate, neither of which a personal project has.
      # Expect a Gatekeeper warning on first launch.
      - name: Build installers
        run: npm run tauri -- build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: gametracker-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  release:
    name: Release
    # Only a pushed version tag becomes a GitHub Release. A manual run still
    # bundles installers as workflow artifacts, but publishes nothing.
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job that can write to the repository, and only to create the
    # release. Everything else keeps the read-only default.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # actions/checkout can leave an annotated tag behind as a lightweight
      # ref, which has no message. Fetch the tag object itself: its message is
      # the release notes, so they are written once, at tagging time.
      - name: Read the release notes from the tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          # Checked by type, not by an empty message: for a lightweight tag,
          # %(contents) silently falls back to the commit's message, which
          # would publish the commit subject as the release title.
          if [ "$(git tag -l --format='%(objecttype)' "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is not an annotated tag — its message is the release notes (git tag -a)."
            exit 1
          fi
          git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME" > title.txt
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md

      # Both platforms' bundles, one directory per artifact.
      - uses: actions/download-artifact@v4
        with:
          pattern: gametracker-*
          path: dist

      # One job publishes, after both bundles exist: two matrix legs creating
      # the same release at once would race. The .app is left out — it is a
      # directory, and the .dmg already contains it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(
            find dist -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) | sort
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no installers found in the downloaded artifacts"
            exit 1
          fi
          printf 'attaching %s\n' "${files[@]}"

          # Re-running a tag's workflow replaces the files rather than failing
          # on "release already exists".
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$(cat title.txt)" \
              --notes-file notes.md
          fi
